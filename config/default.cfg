# binance API config
BINANCE_API_KEY=
BINANCE_SECRET_KEY=
BINANCE_RECV_WINDOW=3000
BINANCE_FEE=0.075

# redis config
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_USERNAME=root

#####################################################################

# тип стратегии
STRATEGY=scalping

# тестовый режим: 1 - включить, 0 - выключить
TEST=1

# риски вхождения в новую позицию, чем выше, тем реже будут открываться, 1 - эталон
RISK=1.0
LOT_MIN=1.0
LOT_MAX=5.0
TAKE_PROFIT=0.5
STOP_LOSS=1.0