# binance API config
BINANCE_API_KEY=
BINANCE_SECRET_KEY=
BINANCE_RECV_WINDOW=3000
BINANCE_FEE=0.075

# redis config
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_USERNAME=root

#####################################################################

# release: реальные сделки
# develop: тоже что и release, только без фактических сделок
# backtest: моментальная проверка доходности путем загрузки чарта за сутки
MODE=release
# размер изначального лота
LOT_SIZE=1.0
# минимальный % изменения цены, для получения прибыли
TAKE_PROFIT=0.2
# остановить убытки, указав % соотношение цены, оставить 0,0 для отключения
STOP_LOSS=0.0
# усреднение проигранных сделок после изменении цены на указанный %
AVERAGING=4.0