# binance API config
BINANCE_API_KEY=
BINANCE_SECRET_KEY=
BINANCE_RECV_WINDOW=3000
BINANCE_FEE=0.075

# redis config
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_USERNAME=root

#####################################################################

# тип стратегии
STRATEGY=scalping

# release: реальные сделки
# develop: тоже что и release, только без фактических сделок
# backtest: моментальная проверка доходности путем загрузки чарта за сутки
MODE=develop

LOT_SIZE=1.0

TAKE_PROFIT=0.2
STOP_LOSS=0.0
AVERAGING=4.0
