# binance API config
BINANCE_API_KEY=
BINANCE_SECRET_KEY=
BINANCE_RECV_WINDOW=3000
BINANCE_FEE=0.075

# redis config
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_USERNAME=root

#####################################################################

# тип стратегии
STRATEGY=scalping

# тестовый режим
# 1 - включить, 0 - выключить
TEST=1

# настройки открытия сделки
# следующую сделку при росте/снижении цены от предыдущей (на %) и умножаем
# но ограничиваемся максимум, который умножится на минимальный лот
# важно: для возможности мержа позиций на закрытии множитель должен быть выше суммы 3х комиссий
OPEN_PRICE_PERCENT=1.5
OPEN_LOT_MULTIPLY=1.3
OPEN_MAX_MULTIPLY=3.0

# настройки закрытия сделки
# минимальный процент роста (для лонгов) или падения (для шортов)
CLOSE_POSITION_PERCENT=0.5
STRONG_TAIL_PERCENT=0.15
