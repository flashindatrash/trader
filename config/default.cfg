# binance API config
BINANCE_API_KEY=
BINANCE_SECRET_KEY=
BINANCE_RECV_WINDOW=3000
BINANCE_FEE=0.075

# redis config
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_USERNAME=root

#####################################################################

# тип стратегии
STRATEGY=scalping

# release: реальные сделки
# develop: тоже что и release, только без фактических сделок
# backtest: моментальная проверка доходности путем загрузки чарта за сутки
MODE=develop

# минимальный профит, и максимальный убыток
TAKE_PROFIT=0.5
STOP_LOSS=5.0

LOT_MIN=1.0
LOT_MAX=5.0
